[package]
name        = "jsonrpc-nv"
version     = "0.1.0"
description = "JSON-RPC 2.0 as typed values: a request whose absent id IS the notification, a response that cannot carry both a result and an error, batches that cannot be empty, the reserved error codes, and the Content-Length framing LSP and DAP put in front of the messages as a feed-and-drain reader."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  Nothing here opens a socket, reads a pipe or starts a
# process: a message is decoded from text the caller already has, and
# the framing reader is fed bytes the caller already read.  Every
# public function's effect row is `[]`.  A transport is a `host`
# package on top of this one.
layer       = "core"

category    = "web"

tags        = ["json-rpc", "jsonrpc", "rpc", "lsp", "dap", "framing", "sans-io", "web"]
repository  = "https://github.com/novolang/jsonrpc-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.14.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "JSON-RPC 2.0 messages and the Content-Length framing over them"

[dependencies]
# None.  `params`, `result` and an error's `data` are the standard
# library's JSON value, `std.json`'s `JsonValueH`, so a caller converts
# nothing on the way in or out.
